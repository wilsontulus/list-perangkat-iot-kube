apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: list-perangkat-iot-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway # Required for Azure's Ingress Gateway (AGIC)
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
